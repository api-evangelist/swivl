name: swivl
description: >-
  swivl is an AI automation platform built specifically for the self-storage
  industry. It combines a unified CRM and contact center that consolidates
  calls, texts, emails, and chats with AI agents for sales, billing, support,
  and review management, plus a tenant mobile app (Spot) for access codes,
  payments, and referrals. Its self-storage natural-language model is trained on
  hundreds of thousands of customer conversations and serves 3,500+ locations.
  Founded in New York City and backed by Techstars, swivl advertises open APIs
  and integrations with major self-storage management systems, but publishes no
  public developer portal, API reference, or machine-readable API specification.
